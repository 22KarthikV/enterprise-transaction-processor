spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:transaction_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:changeme}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:local-dev-jwt-secret-change-in-prod-please-use-a-long-random-value}
    issuer: enterprise-transaction-processor
